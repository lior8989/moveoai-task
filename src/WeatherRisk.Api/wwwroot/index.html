<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Weather Risk Intelligence Agent — rank, compare and explain hub exposure to weather disruption.">
  <title>Weather Risk Intelligence</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛈️</text></svg>">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">⛈️</span>
      <div>
        <h1>Weather Risk Intelligence</h1>
        <p class="subtitle">Which hubs are most exposed to weather disruption — and why</p>
      </div>
    </div>
    <nav class="actions" aria-label="Tools">
      <span id="health" class="health" role="status" title="Service health">…</span>
      <button id="speak" type="button" class="icon-button" aria-pressed="false" title="Read answers aloud">🔊</button>
      <button id="new-chat" type="button" class="text-button" title="Start a new conversation">New chat</button>
      <a class="text-button" href="/swagger" target="_blank" rel="noopener">API</a>
    </nav>
  </header>

  <main class="chat">
    <section id="log" class="log" aria-live="polite" aria-label="Conversation"></section>

    <section class="starter" aria-label="Example questions">
      <h2>Try asking</h2>
      <div id="examples"></div>
    </section>

    <form id="composer" class="composer" autocomplete="off">
      <label for="message" class="visually-hidden">Your question</label>
      <textarea id="message" rows="1" maxlength="2000" placeholder="Ask about hub weather risk… (Enter to send, Shift+Enter for a new line)" required></textarea>
      <button id="mic" type="button" class="icon-button" aria-pressed="false" title="Speak your question">🎤</button>
      <button id="send" type="submit" class="send-button">Send</button>
    </form>
    <p class="footnote">Scores come from a deterministic model; the assistant explains them. Every cited number is checked against the tool results (✓).</p>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
